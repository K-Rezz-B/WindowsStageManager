[package]
name = "stage-manager"
version = "0.1.0"
edition = "2021"
description = "Un Stage Manager façon macOS pour Windows 11"

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Control",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "3.0.12"
